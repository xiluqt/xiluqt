<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xiluqt — Investor Access</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05070d;color:#fff}body{display:grid;place-items:center;padding:24px;overflow:hidden}.orb{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(43,207,255,.16),transparent 65%);filter:blur(10px);pointer-events:none}.card{width:min(480px,100%);padding:36px 28px;border:1px solid rgba(102,219,255,.2);border-radius:28px;background:linear-gradient(180deg,rgba(13,20,32,.96),rgba(5,8,14,.96));box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center;position:relative}.mark{width:66px;height:66px;margin:0 auto 20px;border:1px solid rgba(77,220,255,.35);border-radius:20px;display:grid;place-items:center;color:#55dcff;font-size:30px;font-weight:800;box-shadow:0 0 40px rgba(36,205,255,.12)}.eyebrow{font-size:11px;letter-spacing:.24em;color:#65ddff;margin-bottom:10px}.title{font-size:29px;font-weight:750;letter-spacing:-.04em}.sub{color:#8995a8;line-height:1.6;margin:12px 0 26px}.input{width:100%;padding:16px 17px;border-radius:14px;border:1px solid #253346;background:#0a101a;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:.08em}.input:focus{border-color:#55dcff;box-shadow:0 0 0 3px rgba(85,220,255,.08)}button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:14px;background:#55dcff;color:#031019;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{min-height:22px;margin-top:16px;color:#7f8da2;font-size:13px}.fine{margin-top:24px;color:#536177;font-size:11px;letter-spacing:.08em}.err{color:#ff8b9c}.ok{color:#79f0c0}
</style>
</head>
<body>
<div class="orb"></div>
<main class="card">
  <div class="mark">X</div>
  <div class="eyebrow">XILUQT // PRIVATE INTELLIGENCE</div>
  <div class="title">Investor Access</div>
  <div class="sub">Enter the private access code issued by Xiluqt. Each code can be limited, expired, or revoked by the Xiluqt administrator.</div>
  <form id="form">
    <input id="code" class="input" autocomplete="one-time-code" autocapitalize="characters" placeholder="XQ-••••••••••••••••" required>
    <button id="submit" type="submit">ENTER INTELLIGENCE PLATFORM</button>
  </form>
  <div id="status" class="status"></div>
  <div class="fine">CONTROLLED INVESTOR DEMONSTRATION • XILUQT</div>
</main>
<script>
const SUPABASE_URL='https://pjgtvybvsmiabbxtxjoo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_-RSMOibBZauDrG4AUm3EEg_EoOANyAd';
const FUNCTION_URL=SUPABASE_URL+'/functions/v1/investor-access';
const form=document.querySelector('#form'), code=document.querySelector('#code'), submit=document.querySelector('#submit'), status=document.querySelector('#status');
form.addEventListener('submit',async(e)=>{
  e.preventDefault(); submit.disabled=true; status.className='status'; status.textContent='VERIFYING ACCESS…';
  try{
    const r=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:'redeem',code:code.value})});
    const data=await r.json();
    if(!r.ok||!data.token) throw new Error(data.error||'Access denied');
    sessionStorage.setItem('xiluqt_investor_token',data.token);
    status.className='status ok'; status.textContent='ACCESS VERIFIED • LOADING INTELLIGENCE…';
    const p=await fetch(FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+data.token},body:JSON.stringify({action:'prototype'})});
    if(!p.ok) throw new Error('Protected prototype unavailable');
    const html=await p.text(); document.open(); document.write(html); document.close();
  }catch(err){status.className='status err'; status.textContent=err.message||'Access denied'; submit.disabled=false;}
});
</script>
</body>
</html>
