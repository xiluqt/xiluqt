name: Remove public learning UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-learning-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove public learning UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove both desktop and mobile Learn buttons.
          s = re.sub(r'<button data-page="learn">.*?</button>', '', s)
          # Remove the complete public learning page, leaving API immediately after Live.
          s = re.sub(r'<section id="learn" class="page">.*?(?=<section id="api" class="page">)', '', s, flags=re.S)
          # Remove the learning navigation callback.
          s = s.replace("if(page==='learn')renderLearning()", '')
          # Remove the local learning engine block so removed DOM IDs cannot break the app.
          s = re.sub(r"const WKEY='xiluqt-learning-v2';.*?renderLearning\(\);", '', s, flags=re.S)
          # Four bottom-nav slots after removing Learn.
          s = s.replace('grid-template-columns:repeat(5,1fr)', 'grid-template-columns:repeat(4,1fr)')
          p.write_text(s, encoding='utf-8')
      - name: Commit cleaned index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove AI Learning from public UI'
          git push