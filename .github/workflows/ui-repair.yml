name: Xiluqt UI repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject movement-risk repair module
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='XQ-UI-REPAIR-V1'
          if marker in s:
              raise SystemExit(0)
          tag='<!-- XQ-UI-REPAIR-V1 --><script src="./brain/ui_repair.js" defer></script><!-- /XQ-UI-REPAIR-V1 -->'
          s=s.replace('</head>',tag+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: restore movement risk trend runtime'
          git push
