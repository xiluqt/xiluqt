name: Remove Xiluqt auth gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-auth-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove auth gate
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<!-- XQ-AUTH-GATE-V1 -->.*?<!-- /XQ-AUTH-GATE-V1 -->\s*'
          cleaned, n = re.subn(pattern, '', s, flags=re.S)
          if n:
              p.write_text(cleaned, encoding='utf-8')
              print('Removed XQ-AUTH-GATE-V1')
          else:
              print('Auth gate already absent')
      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove Xiluqt login and email verification interface'
          git push