<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Xiluqt Reset</title><style>html,body{height:100%;margin:0;background:#030b18;color:#eaf6ff;font-family:system-ui;display:grid;place-items:center}main{text-align:center;padding:24px}h1{font-size:28px}p{color:#83a6c7}button{border:0;border-radius:12px;padding:14px 22px;background:#1689df;color:white;font-weight:800;font-size:16px}</style></head><body><main><h1>Xiluqt is refreshing…</h1><p>Clearing the old cached login screen.</p><button id="go">Open Xiluqt</button></main><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}const u='./index.html?fresh=20260907';location.replace(u);})();document.getElementById('go').onclick=()=>location.replace('./index.html?fresh=20260907')</script></body></html>
